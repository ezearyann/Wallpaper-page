<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gaming Wallpaper Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<STYLE>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#050816;
    color:white;
    overflow-x:hidden;
}

/* Background Glow */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top left,#00e5ff33,transparent 35%),
        radial-gradient(circle at bottom right,#ff003c22,transparent 35%);
    z-index:-1;
}

/* Heading */

header{
    padding:40px;
    text-align:center;
}

header h1{
    font-size:55px;
    letter-spacing:3px;
    color:#fff;
    text-shadow:0 0 20px cyan;
}

header p{
    color:#cfcfcf;
    margin-top:10px;
}

/* Gallery */

.gallery{
    width:90%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:35px;
    padding-bottom:60px;
}

/* Cards */

.card{
    position:relative;
    height:600px;
    overflow:hidden;
    border-radius:20px;
    cursor:pointer;
    transition:.4s;
    box-shadow:0 10px 25px rgba(0,0,0,.5);
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.6s;
}

.card:hover img{
    transform:scale(1.12);
}

.card:hover{
    transform:translateY(-12px);
    box-shadow:0 0 30px cyan;
}

/* Overlay */

.overlay{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:25px;
    background:linear-gradient(transparent,rgba(0,0,0,.95));
}

.overlay h2{
    font-size:30px;
    color:#00e5ff;
}

.overlay p{
    margin-top:8px;
    color:#ddd;
}

/* Footer */

footer{
    text-align:center;
    padding:25px;
    color:#888;
}

/* Mobile */

@media(max-width:768px){

    header h1{
        font-size:40px;
    }

    .card{
        height:420px;
    }

}
</STYLE>
<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🔥 Gaming Wallpapers 🔥</h1>

<p>Download your favorite superhero & gaming wallpapers.</p>

</header>

<div class="gallery">

    <div class="card">

        <img src="https://i.pinimg.com/736x/d4/a1/d0/d4a1d0b160063a669fdba153a90a6be7.jpg" alt="Kratos">

        <div class="overlay">
            <h2>Kratos</h2>
            <p>The Ghost of Sparta</p>
        </div>

    </div>

    <div class="card">

        <img src="https://i.pinimg.com/736x/5b/f4/a9/5bf4a989ac96489a138b7f2dc223ebd0.jpg" alt="Thor">

        <div class="overlay">
            <h2>Thor</h2>
            <p>God of Thunder</p>
        </div>

    </div>

    <div class="card">

        <img src="https://playcontestofchampions.com/wp-content/uploads/2023/04/champion-iron-man-infinity-war.webp" alt="Iron Man">

        <div class="overlay">
            <h2>Tony Stark</h2>
            <p>Iron Man</p>
        </div>

    </div>

    <div class="card">

        <img src="https://upload.wikimedia.org/wikipedia/en/0/0f/Tom_Holland_as_Spider-Man.jpg" alt="Spider-Man">

        <div class="overlay">
            <h2>Spider-Man</h2>
            <p>Your Friendly Neighborhood Hero</p>
        </div>

    </div>

</div>

<footer>
    Made with ❤️ by Aryan
</footer>

</body>
</html>
